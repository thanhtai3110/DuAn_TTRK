# Free hosting only. Data is stored in a separate Turso Free database.
# Do not add a paid disk or upgrade the plan without explicit approval.
services:
  - type: web
    name: jobconnect
    runtime: node
    region: singapore
    plan: free
    numInstances: 1
    buildCommand: npm --prefix backend ci --omit=dev && npm --prefix frontend ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: REQUIRE_REMOTE_DB
        value: "true"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
